# model: "Qwen3.5-27B"
# model: "gpt-4o-2024-11-20"
# model: "anthropic/claude-sonnet-4-6"
# retrieve_model: "gpt-5.4"  # defaults to `model` if not set

# 索引构建模型（阿里云百炼）
model: "qwen-doc-turbo"
# 检索模型（和上面保持一致即可）
retrieve_model: "qwen-doc-turbo"
# 目录检查页数（公文类 2 页刚好）
toc_check_page_num: 2
# 最大页数/节点（公文不要太大，20 最稳）
max_page_num_each_node: 20
# 最大 token/节点（qwen-doc 8K 足够）
max_token_num_each_node: 8000
# 功能开关
if_add_node_id: "yes"
if_add_node_summary: "yes"
if_add_doc_description: "no"
if_add_node_text: "no"